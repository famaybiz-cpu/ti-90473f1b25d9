<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tarjetas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tarjetas Internado</title>
<style>
:root{
  --bg:#fbf3f1;--bg2:#f6e6e6;--card:#ffffff;--ink:#3a2230;--ink2:#7d6272;--line:#efd9dd;
  --rose:#d4708a;--rose2:#b9577a;--blush:#f8e1e7;--gold:#c39a5a;--gold2:#f3e6cf;
  --new:#8b7fd0;--learn:#d4607a;--rev:#6f9f86;
  --again:#d9607a;--hard:#d5a15a;--good:#76a58b;--easy:#8aa0d6;
  --shadow:0 10px 30px -12px rgba(185,87,122,.35);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --fs:1;
}
:root[data-theme=dark]{
  --bg:#1b1217;--bg2:#241820;--card:#2b1d26;--ink:#f6e8ee;--ink2:#b99dab;--line:#3d2a35;
  --rose:#e79ab1;--rose2:#f0b3c5;--blush:#3a2430;--gold:#dcb97f;--gold2:#3a3022;
  --new:#a99ee6;--learn:#ee8aa0;--rev:#8fc2a6;--shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;overscroll-behavior:none}
body{background:radial-gradient(1200px 500px at 85% -10%,var(--blush),transparent 60%),var(--bg);}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.2px}
#app{max-width:760px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.hidden{display:none!important}
/* hero */
.hero{padding:6px 4px 14px}
.hello{font-family:var(--serif);font-size:27px;line-height:1.15}
.hello small{display:block;font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:6px;letter-spacing:.3px}
.orn{color:var(--gold);letter-spacing:6px;font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.exam{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:21px}
.exam .t{flex:1;min-width:0}
.exam .t h3{font-size:19px}
.exam .t p{margin:4px 0 0;color:var(--ink2);font-size:13px;line-height:1.35}
.big{display:block;width:100%;padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;font-weight:600;font-size:17px;box-shadow:var(--shadow);letter-spacing:.3px}
.big small{display:block;font-weight:400;opacity:.9;font-size:12.5px;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ghost{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{padding:6px 12px;border-radius:99px;background:var(--blush);color:var(--rose2);font-size:12.5px;border:1px solid transparent}
.chip.on{background:var(--rose);color:#fff}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.sect h2{font-size:21px}.sect span{font-size:12px;color:var(--ink2)}
.cnt{display:flex;gap:9px;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600}
.cnt .n{color:var(--new)}.cnt .l{color:var(--learn)}.cnt .r{color:var(--rev)}
.cnt .z{opacity:.28}
.deck{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:8px 0;overflow:hidden}
.dh{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dn{flex:1;min-width:0;font-family:var(--serif);font-size:17px}
.dn small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink2);margin-top:2px}
.chev{color:var(--ink2);transition:.2s;font-size:13px}
.deck.open .chev{transform:rotate(90deg)}
.segs{display:none;border-top:1px solid var(--line);background:linear-gradient(var(--bg2),transparent)}
.deck.open .segs{display:block}
.seg{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 36px;width:100%;text-align:left;border-bottom:1px dashed var(--line)}
.seg:last-child{border-bottom:0}
.seg .sn{flex:1;font-size:13.5px;line-height:1.3}
.seg.all{font-weight:600;color:var(--rose2)}
.mini{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold))}
/* tabs */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:4px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow);z-index:20;width:min(420px,calc(100% - 28px))}
#tabs button{flex:1;padding:9px 4px;border-radius:20px;font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:19px;line-height:1}
#tabs button.on{background:var(--blush);color:var(--rose2);font-weight:600}
/* study */
#study{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;max-width:100%;padding-top:env(safe-area-inset-top)}
#study:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 50% -8%,var(--blush),transparent 65%);pointer-events:none}
.sh{display:flex;align-items:center;gap:8px;padding:8px 12px;position:relative;max-width:760px;width:100%;margin:0 auto}
.sh .ic{width:40px;height:40px;border-radius:14px;font-size:20px;color:var(--ink2)}
.sh .ttl{flex:1;text-align:center;min-width:0}
.sh .ttl b{display:block;font-family:var(--serif);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh .cnt{justify-content:center;margin-top:2px}
.sbar{height:4px;background:var(--line);margin:0 16px;border-radius:4px;overflow:hidden;position:relative;max-width:728px;width:calc(100% - 32px);align-self:center}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .35s}
.stage{flex:1;overflow:auto;display:flex;padding:16px;position:relative;max-width:760px;width:100%;margin:0 auto}
.scard{margin:auto;width:100%;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px 24px 26px;box-shadow:var(--shadow);text-align:center;position:relative;font-size:calc(21px * var(--fs));line-height:1.45}
.scard:before{content:"";position:absolute;inset:8px;border:1px solid var(--gold2);border-radius:21px;pointer-events:none}
.scard .tag{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;font-family:var(--sans)}
.scard .star{position:absolute;top:14px;right:18px;font-size:20px;color:var(--gold)}
.scard hr{border:0;height:1px;margin:22px auto;width:60%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.scard .cb{color:var(--rose2);font-weight:500}
.scard .cb b{color:var(--ink)}
.cb.list{text-align:left;display:inline-block}
.sf{padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);position:relative;max-width:760px;width:100%;margin:0 auto}
.show{width:100%;padding:17px;border-radius:18px;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;font-weight:600;font-size:17px;box-shadow:var(--shadow)}
.ans{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ans button{padding:11px 2px 10px;border-radius:16px;color:#fff;font-weight:600;font-size:14px;line-height:1.2;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.ans small{display:block;font-weight:400;font-size:11.5px;opacity:.92;margin-top:3px}
.a1{background:var(--again)}.a2{background:var(--hard)}.a3{background:var(--good)}.a4{background:var(--easy)}
.menu{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 52px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;z-index:5;min-width:210px}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-size:14.5px}
.menu button:active{background:var(--blush)}
.done{margin:auto;text-align:center;padding:10px}
.done .flower{font-size:56px;color:var(--rose)}
.done h2{font-size:26px;margin:6px 0}
.done p{color:var(--ink2);line-height:1.5}
.done .big{margin-top:12px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(40,20,32,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
#sheet .in{background:var(--bg);width:min(560px,100%);border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#sheet h3{font-size:22px;margin-bottom:4px}
#sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
#sheet .big{margin-bottom:10px}
/* browse/stats/settings */
.search{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none}
.search:focus{border-color:var(--rose)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:8px 0;font-size:14.5px;line-height:1.45}
.item .m{font-size:11.5px;color:var(--gold);letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.item .bk{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);color:var(--rose2)}
.item.open .bk{display:block}
.item .st{float:right;color:var(--gold);font-size:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-size:26px;color:var(--rose2)}
.kpi span{font-size:11.5px;color:var(--ink2)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line)}
.fc{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:6px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10px;color:var(--ink2)}
.fc i{width:100%;background:linear-gradient(var(--rose),var(--gold));border-radius:7px 7px 3px 3px;min-height:2px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.set:last-child{border:0}
.set label{flex:1;font-size:14.5px;line-height:1.3}.set label small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.set input[type=number],.set select{width:92px;padding:9px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;text-align:center}
.set select{width:120px}
.sw{position:relative;width:50px;height:30px;border-radius:30px;background:var(--line);flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw.on{background:var(--rose)}.sw.on:after{left:23px}
.note{font-size:12.5px;color:var(--ink2);line-height:1.5}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:99;box-shadow:var(--shadow)}
@media (min-width:700px){.scard{padding:44px 40px}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav id="tabs">
  <button data-tab="home" class="on"><span>❀</span>Inicio</button>
  <button data-tab="browse"><span>⌕</span>Buscar</button>
  <button data-tab="stats"><span>✦</span>Progreso</button>
  <button data-tab="set"><span>☾</span>Ajustes</button>
</nav>
<section id="study" class="hidden"></section>
<div id="sheet" class="hidden"></div>
<script src="data.enc.js"></script>
<script>
"use strict";
function main(){
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const DAY=86400000, LS='tf_v1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const strip=h=>h.replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'');
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dayNum(t=Date.now()){const d=new Date(t-4*3600e3);return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY)}
const PAL=['#d4708a','#9a8fd0','#d9a05b','#76a58b','#7fa7d6','#c47fb0','#e08a6f','#6fb3a8'];
const EMO=['🌸','🌷','🌿','🌼','💮','🪻'];
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

/* ============ datos ============ */
const ALL=[],BYID=new Map(),ESPS=[];
(window.TF_DATA||[]).forEach((e,ei)=>{
  const E={name:e.e,color:PAL[ei%PAL.length],segs:[],cards:[]};
  e.segs.forEach(sg=>{
    const G={id:sg.id,name:sg.n,esp:E,cards:[]};
    sg.c.forEach(([f,b],i)=>{
      const c={id:sg.id+':'+hash(f).toString(36),f,b,seg:G,esp:E,txt:norm(strip(f+' '+b))};
      G.cards.push(c);E.cards.push(c);ALL.push(c);BYID.set(c.id,c);
    });
    E.segs.push(G);
  });
  ESPS.push(E);
});

/* ============ estado ============ */
const DEF_SET={newPerDay:30,auto:false,exam:'2026-11-08',cap:true,theme:'auto',font:100,mix:true,maxRev:400,name:'futura doctora'};
let S=(()=>{try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.c)return j}catch(e){}return{c:{},log:{},nd:{day:0,n:0,extra:0},rd:{day:0,n:0},set:{...DEF_SET}}})();
S.set={...DEF_SET,...S.set};
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}},150)}
function rollover(){const d=dayNum();if(S.nd.day!==d)S.nd={day:d,n:0,extra:0};if(S.rd.day!==d)S.rd={day:d,n:0}}
const NEW={t:0,ef:2500,iv:0,l:0,r:0};
const cs=id=>S.c[id]||NEW;
function applyTheme(){const t=S.set.theme;const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.setProperty('--fs',S.set.font/100);document.querySelector('meta[name=theme-color]').content=dark?'#1b1217':'#fbf3f1'}
applyTheme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

/* ============ examen y plan ============ */
function examDate(){return new Date(S.set.exam+'T07:00:00-05:00')}
function daysToExam(){return Math.max(0,Math.ceil((examDate()-Date.now())/DAY))}
function totalNew(){let n=0;for(const c of ALL){const s=S.c[c.id];if(!s||s.t===0&&!s.susp)n++}return n}
function planNew(){const left=Math.max(1,daysToExam()-1);return Math.ceil((totalNew()+S.nd.n)/left)}
function newLimit(){return (S.set.auto?planNew():S.set.newPerDay)+S.nd.extra}
function newQuota(){return Math.max(0,newLimit()-S.nd.n)}
function capDays(){return S.set.cap?Math.max(1,Math.floor(daysToExam()/2)):36500}

/* ============ planificador (estilo Anki, pasos 1 min y 10 min) ============ */
const STEPS=[1,10],RELEARN=10;
function sched(c,e){
  const n={...c},now=Date.now(),td=dayNum(),cap=capDays();
  const grad=d=>{n.t=2;n.iv=Math.max(1,Math.min(d,cap));n.due=td+n.iv;n.s=0;n.ef=n.ef||2500};
  if(c.t===0||c.t===1){
    const st=c.t===0?0:c.s;
    if(e===1){n.t=1;n.s=0;n.due=now+STEPS[0]*60000}
    else if(e===2){n.t=1;n.s=st;n.due=now+(st===0?Math.round((STEPS[0]+STEPS[1])/2):STEPS[st])*60000}
    else if(e===3){if(st+1<STEPS.length){n.t=1;n.s=st+1;n.due=now+STEPS[st+1]*60000}else grad(1)}
    else grad(4);
  }else if(c.t===3){
    if(e===1){n.due=now+RELEARN*60000}
    else if(e===2){n.due=now+Math.round(RELEARN*1.5)*60000}
    else if(e===3){n.t=2;n.due=td+Math.max(1,Math.min(c.iv||1,cap))}
    else{n.t=2;n.iv=Math.max(1,Math.min((c.iv||1)+1,cap));n.due=td+n.iv}
  }else{
    const iv=Math.max(1,c.iv||1),ef=c.ef||2500;
    if(e===1){n.l=(c.l||0)+1;n.ef=Math.max(1300,ef-200);n.iv=Math.max(1,Math.floor(iv*.3));n.t=3;n.due=now+RELEARN*60000}
    else{
      const hard=Math.max(iv+1,Math.round(iv*1.2)),good=Math.max(hard+1,Math.round(iv*ef/1000)),easy=Math.max(good+1,Math.round(iv*ef/1000*1.3));
      const v=e===2?hard:e===3?good:easy;
      if(e===2)n.ef=Math.max(1300,ef-150);if(e===4)n.ef=ef+150;
      n.iv=Math.max(1,Math.min(v,cap));n.due=td+n.iv;n.t=2;
    }
  }
  n.r=(c.r||0)+1;return n;
}
function lbl(c,e){
  const n=sched(c,e);
  if(n.t===1||n.t===3){const m=Math.max(1,Math.round((n.due-Date.now())/60000));return m<60?m+' min':Math.round(m/60)+' h'}
  const d=n.iv;return d<30?d+' d':d<365?(d/30).toFixed(1).replace('.',',')+' m':(d/365).toFixed(1)+' a';
}

/* ============ colas ============ */
function cardsOf(scope){return scope.cards||ALL}
function counts(list){
  const now=Date.now(),td=dayNum();let n=0,l=0,r=0;
  for(const c of list){const s=S.c[c.id];
    if(!s){n++;continue}
    if(s.susp||s.bury===td)continue;
    if(s.t===0)n++;else if(s.t===2){if(s.due<=td)r++}else if(s.due<=now+20*60000)l++;
  }return{n,l,r};
}
function shownCounts(list){const c=counts(list);return{n:Math.min(c.n,newQuota()),l:c.l,r:Math.min(c.r,Math.max(0,S.set.maxRev-S.rd.n))}}
function nextCard(scope){
  rollover();const now=Date.now(),td=dayNum(),list=cardsOf(scope);
  const learn=[],rev=[],nw=[];let ahead=null;
  for(const c of list){
    const s=S.c[c.id];
    if(!s){nw.push(c);continue}
    if(s.susp||s.bury===td)continue;
    if(s.t===0)nw.push(c);
    else if(s.t===2){if(s.due<=td)rev.push(c)}
    else{if(s.due<=now)learn.push(c);else if(s.due<=now+20*60000&&(!ahead||s.due<S.c[ahead.id].due))ahead=c}
  }
  if(learn.length){learn.sort((a,b)=>S.c[a.id].due-S.c[b.id].due);return learn[0]}
  const revLeft=Math.max(0,S.set.maxRev-S.rd.n),nq=newQuota();
  rev.sort((a,b)=>cs(a.id).due-cs(b.id).due||hash(a.id+td)-hash(b.id+td));
  if(S.set.mix)nw.sort((a,b)=>hash(a.id+td)-hash(b.id+td));
  // intercala: una nueva cada ~4 repasos
  const done=S.nd.n+S.rd.n;
  if(rev.length&&revLeft>0&&nw.length&&nq>0&&scope.mixNew!==false&&done%5===4)return nw[0];
  if(rev.length&&revLeft>0)return rev[0];
  if(nw.length&&nq>0)return nw[0];
  return ahead;
}

/* ---- estudio ---- */
let Q=null,undo=[],cur=null,shown=false,t0=0,cramList=[],cramTotal=0,sessStart=0,sessN=0;
function startStudy(scope){
  Q=scope;undo=[];sessN=0;sessStart=dayNum();
  if(scope.cram){cramList=scope.cards.slice().sort(()=>Math.random()-.5);cramTotal=cramList.length}
  $('#study').classList.remove('hidden');document.body.style.overflow='hidden';
  buildStudyShell();showNext();
}
function buildStudyShell(){
  $('#study').innerHTML=`<div class="sh"><button class="ic" id="xBack">✕</button><div class="ttl"><b>${esc(Q.title)}</b><div id="xc"></div></div><button class="ic" id="xMenu">⋯</button></div>
  <div class="sbar"><i id="xp"></i></div><div class="stage" id="stage"></div><div class="sf" id="sf"></div>`;
  $('#xBack').onclick=endStudy;
  $('#xMenu').onclick=toggleMenu;
}
function endStudy(){$('#study').classList.add('hidden');document.body.style.overflow='';Q=null;cur=null;render()}
function updCounts(){
  if(Q.cram){$('#xc').innerHTML=`<div class="cnt"><span class="n">${cramList.length}</span></div>`;$('#xp').style.width=(cramTotal?(1-cramList.length/cramTotal)*100:100)+'%';return}
  const c=shownCounts(Q.cards);$('#xc').innerHTML=cntHTML(c,false);
  const total=c.n+c.l+c.r+sessN;$('#xp').style.width=(total?sessN/total*100:100)+'%';
}
function showNext(){
  closeMenu();shown=false;
  cur=Q.cram?cramList[0]||null:nextCard(Q);
  updCounts();
  const stg=$('#stage'),sf=$('#sf');
  if(!cur)return finished();
  const s=cs(cur.id),isList=cur.b.includes('→');
  stg.innerHTML=`<div class="scard" id="sc"><div class="tag">${esc(cur.seg.name)}</div>${s.star?'<span class="star">✦</span>':''}<div class="cf">${cur.f}</div><div id="back" class="hidden"><hr><div class="cb${isList?' list':''}">${cur.b}</div></div></div>`;
  sf.innerHTML=`<button class="show" id="show">Mostrar respuesta</button>`;
  $('#show').onclick=reveal;stg.onclick=e=>{if(!shown&&!e.target.closest('button'))reveal()};
  t0=Date.now();stg.scrollTop=0;
}
function reveal(){
  if(shown||!cur)return;shown=true;$('#back').classList.remove('hidden');
  const sf=$('#sf');
  if(Q.cram){sf.innerHTML=`<div class="ans" style="grid-template-columns:1fr 1fr"><button class="a1" data-e="1">Repasar luego<small>vuelve al final</small></button><button class="a3" data-e="3">Ya la sé<small>quitar</small></button></div>`}
  else{const c=cs(cur.id);sf.innerHTML=`<div class="ans">${[1,2,3,4].map(e=>`<button class="a${e}" data-e="${e}">${['Otra vez','Difícil','Bien','Fácil'][e-1]}<small>${lbl(c,e)}</small></button>`).join('')}</div>`}
  sf.querySelectorAll('button').forEach(b=>b.onclick=()=>answer(+b.dataset.e));
  $('#stage').scrollTo({top:99999,behavior:'smooth'});
}
function answer(e){
  if(!cur)return;rollover();
  const ms=Math.min(60000,Date.now()-t0);
  if(Q.cram){const c=cramList.shift();if(e===1)cramList.push(c);sessN++;return showNext()}
  const prev=S.c[cur.id]?{...S.c[cur.id]}:null,wasNew=!S.c[cur.id]||S.c[cur.id].t===0;
  const was=cs(cur.id);
  undo.push({id:cur.id,prev,wasNew,wasRev:was.t===2,d:dayNum(),ms,e});if(undo.length>30)undo.shift();
  S.c[cur.id]=sched(was,e);
  const d=dayNum();const L=S.log[d]||(S.log[d]={n:0,ms:0,ag:0,rv:0,ok:0,nw:0});
  L.n++;L.ms+=ms;if(e===1)L.ag++;
  if(was.t===2){L.rv++;if(e>1)L.ok++}
  if(wasNew){S.nd.n++;L.nw++}
  if(was.t===2)S.rd.n++;
  sessN++;save();showNext();
}
function doUndo(){
  const u=undo.pop();if(!u)return toast('Nada que deshacer');
  if(u.prev)S.c[u.id]=u.prev;else delete S.c[u.id];
  const L=S.log[u.d];if(L){L.n--;L.ms-=u.ms;if(u.e===1)L.ag--;if(u.wasRev){L.rv--;if(u.e>1)L.ok--}if(u.wasNew)L.nw--}
  if(u.wasNew)S.nd.n=Math.max(0,S.nd.n-1);if(u.wasRev)S.rd.n=Math.max(0,S.rd.n-1);
  sessN=Math.max(0,sessN-1);save();showNext();
}
function finished(){
  const stg=$('#stage'),sf=$('#sf');sf.innerHTML='';
  const L=S.log[dayNum()]||{n:0,ms:0};
  const nextL=learnWaiting();
  stg.innerHTML=`<div class="done"><div class="flower">✿</div><h2>${Q.cram?'Repaso completo':'¡Terminaste por hoy!'}</h2>
  <p>${sessN} tarjetas en esta sesión · hoy llevas ${L.n} (${Math.round(L.ms/60000)} min).<br>${nextL?`Tienes ${nextL} tarjetas por volver a ver en unos minutos.`:'Descansa: tu yo del examen te lo va a agradecer.'}</p>
  ${Q.cram?'':`<button class="big" id="dMore">+10 tarjetas nuevas</button>`}<button class="ghost" style="width:100%;margin-top:10px" id="dBack">Volver al inicio</button></div>`;
  $('#dBack').onclick=endStudy;const m=$('#dMore');if(m)m.onclick=()=>{S.nd.extra+=10;save();showNext()};
}
function learnWaiting(){let n=0;for(const c of cardsOf(Q)){const s=S.c[c.id];if(s&&(s.t===1||s.t===3)&&!s.susp)n++}return n}
function toggleMenu(){const m=$('#study .menu');if(m)return closeMenu();if(!cur&&!undo.length)return;
  const s=cur?cs(cur.id):{};const d=document.createElement('div');d.className='menu';
  d.innerHTML=`<button data-a="u">↶ Deshacer</button>${cur?`<button data-a="s">${s.star?'✦ Quitar marca':'✦ Marcar tarjeta'}</button><button data-a="b">☾ Enterrar hasta mañana</button><button data-a="x">⌀ Suspender tarjeta</button>`:''}<button data-a="e">✕ Terminar</button>`;
  d.onclick=e=>{const a=e.target.dataset.a;if(!a)return;closeMenu();
    if(a==='u')doUndo();else if(a==='e')endStudy();
    else if(a==='s'){const c=S.c[cur.id]||(S.c[cur.id]={...NEW});c.star=!c.star;save();showNext();toast(c.star?'Marcada ✦':'Marca quitada')}
    else if(a==='b'){const c=S.c[cur.id]||(S.c[cur.id]={...NEW});c.bury=dayNum();save();showNext()}
    else if(a==='x'){const c=S.c[cur.id]||(S.c[cur.id]={...NEW});c.susp=true;save();showNext();toast('Suspendida (reactívala en Buscar)')}};
  $('#study').appendChild(d)}
function closeMenu(){const m=$('#study .menu');if(m)m.remove()}
document.addEventListener('keydown',e=>{
  if($('#study').classList.contains('hidden'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();shown?answer(Q.cram?3:3):reveal()}
  else if(shown&&'1234'.includes(e.key))answer(+e.key);
  else if(e.key==='z')doUndo();else if(e.key==='Escape')endStudy();
});

function streak(){let d=dayNum(),n=0;if(!(S.log[d]&&S.log[d].n))d--;while(S.log[d]&&S.log[d].n){n++;d--}return n}
function vStats(){
  const td=dayNum(),L=S.log[td]||{n:0,ms:0,ag:0,rv:0,ok:0};
  let nw=0,young=0,mature=0,lrn=0,tr=0,tok=0;
  const fc=new Array(14).fill(0);
  for(const c of ALL){const s=S.c[c.id];if(!s||s.t===0){nw++;continue}
    if(s.t===2){if(s.iv>=21)mature++;else young++;const k=Math.max(0,s.due-td);if(k<14)fc[k]++}else lrn++}
  for(const k in S.log){tr+=S.log[k].rv||0;tok+=S.log[k].ok||0}
  const ret=tr?Math.round(tok/tr*100):null;
  let heat='';const start=td-(7*14-1)-((new Date().getDay()+6)%7)+((new Date().getDay()+6)%7);
  const mx=Math.max(1,...Object.values(S.log).map(x=>x.n||0));
  for(let i=0;i<98;i++){const d=td-97+i,n=(S.log[d]||{}).n||0;const a=n?0.25+0.75*n/mx:0;heat+=`<i title="${n}" style="${n?`background:color-mix(in srgb,var(--rose) ${Math.round(a*100)}%,var(--line))`:''}"></i>`}
  const fm=Math.max(1,...fc);
  const allReviews=Object.values(S.log).reduce((a,x)=>a+(x.n||0),0);
  V.innerHTML=`<div class="hero"><div class="orn">✿</div><h1 style="font-size:26px;margin-top:4px">Tu progreso</h1></div>
  <div class="grid3"><div class="kpi"><b>${L.n}</b><span>hoy</span></div><div class="kpi"><b>${streak()}</b><span>días de racha</span></div><div class="kpi"><b>${ret==null?'–':ret+'%'}</b><span>retención</span></div></div>
  <div class="panel"><h3 style="font-size:17px">Estado de tus tarjetas</h3>
    <div class="grid3" style="margin-top:10px"><div class="kpi"><b style="color:var(--new)">${nw}</b><span>nuevas</span></div><div class="kpi"><b style="color:var(--learn)">${lrn+young}</b><span>aprendiendo</span></div><div class="kpi"><b style="color:var(--rev)">${mature}</b><span>maduras (≥21 d)</span></div></div>
    <div class="note" style="margin-top:10px">${allReviews.toLocaleString('es')} respuestas en total · hoy ${Math.round(L.ms/60000)} min de estudio.</div></div>
  <div class="panel"><h3 style="font-size:17px">Repasos que vienen (14 días)</h3><div class="fc">${fc.map((v,i)=>`<div>${v?v:''}<i style="height:${v/fm*80}%"></i>${i===0?'hoy':'+'+i}</div>`).join('')}</div></div>
  <div class="panel"><h3 style="font-size:17px;margin-bottom:10px">Constancia (14 semanas)</h3><div class="heat" style="grid-template-columns:none">${heat}</div></div>`;
  $('.heat').style.gridTemplateRows='repeat(7,1fr)';$('.heat').style.gridAutoColumns='1fr';
}

/* ============ candado: el contenido está cifrado (AES-256-GCM) ============ */
async function decryptData(pass,E){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.i)},key,b(E.c));
  return new TextDecoder().decode(pt);
}

  const go=async()=>{
